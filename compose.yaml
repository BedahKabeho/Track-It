services:
  # PostgreSQL database service
  db:
    image: postgres:15
    container_name: trackit-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: trackitdb
      POSTGRES_USER: trackituser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackit-dev-password}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackituser -d trackitdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django backend service
  backend:
    build:
      context: ./Backend_Track_It

    container_name: trackit-backend

    environment:
      POSTGRES_DB: trackitdb
      POSTGRES_USER: trackituser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackit-dev-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-change-before-deploy}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

    ports:
      - "8001:8000"

    volumes:
      - ./Backend_Track_It:/app

    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_DIST_DIR: .next-docker
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

# Persistent PostgreSQL storage
volumes:
  postgres_data:
  frontend_node_modules:
