services:
  # PostgreSQL database service
  db:
    image: postgres:15
    container_name: trackit-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: trackitdb
      POSTGRES_USER: trackituser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackituser -d trackitdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django backend service
  backend:
    build:
      context: ./Backend_Track_It

    container_name: trackit-backend

    env_file:
      - .env

    environment:
      POSTGRES_DB: trackitdb
      POSTGRES_USER: trackituser
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    ports:
      - "8001:8000"

    volumes:
      - ./Backend_Track_It:/app

    depends_on:
      db:
        condition: service_healthy

# Persistent PostgreSQL storage
volumes:
  postgres_data: